version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ALLOWED_HOSTS=20.200.128.111,localhost,127.0.0.1
      - CORS_ALLOWED_ORIGINS=http://20.200.128.111,http://localhost:3000,http://localhost
      - CSRF_TRUSTED_ORIGINS=http://20.200.128.111,http://localhost:3000,http://localhost

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=http://20.200.128.111
    ports:
      - "3000:3000"
